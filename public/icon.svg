<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.4" />

  <!-- Central Symbol: Speech waves & Gemini Sparkle -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Gemini 4-point sparkle in center top -->
    <path d="M 0 -130 Q 0 -60 70 -60 Q 0 -60 0 10 Q 0 -60 -70 -60 Q 0 -60 0 -130 Z" fill="url(#accentGrad)" />

    <!-- Left Speech Bubble -->
    <path d="M -160 -40 C -160 -80 -100 -100 -40 -100 C -10 -100 20 -80 20 -40 C 20 0 -20 20 -70 20 C -90 20 -120 40 -140 50 C -135 35 -135 25 -145 15 C -155 0 -160 -20 -160 -40 Z" fill="#3b82f6" opacity="0.85" />
    <!-- Speech bubble line -->
    <line x1="-120" y1="-50" x2="-20" y2="-50" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <line x1="-120" y1="-25" x2="-50" y2="-25" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

    <!-- Right Speech Bubble -->
    <path d="M 160 30 C 160 -10 100 -30 40 -30 C 10 -30 -20 -10 -20 30 C -20 70 20 90 70 90 C 90 90 120 110 140 120 C 135 105 135 95 145 85 C 155 70 160 50 160 30 Z" fill="#10b981" opacity="0.9" />
    <!-- Speech bubble line -->
    <line x1="20" y1="20" x2="120" y2="20" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <line x1="50" y1="45" x2="120" y2="45" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

    <!-- Bidirectional Translation Arrow Symbol -->
    <path d="M -40 140 L 40 140 M 20 120 L 40 140 L 20 160" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 40 180 L -40 180 M -20 160 L -40 180 L -20 200" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
